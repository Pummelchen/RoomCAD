# RoomCAD — proper HTTPS via nip.io, proxying to the Caddy server on :8077.
#
# Installed on the VPS at /etc/nginx/sites-available/roomcad.conf (symlinked
# into sites-enabled/). The Let's Encrypt cert for roomcad.91.99.176.243.nip.io
# is obtained once with certbot and auto-renews:
#
#   certbot certonly --webroot -w /var/minecraftai/web/site/public \
#     -d roomcad.91.99.176.243.nip.io --key-type ecdsa --agree-tos --non-interactive
#
# (nginx also serves the minecraftai site on pummelchen…nip.io from a separate
# config, so Caddy cannot bind 80/443 — hence this proxy.)

server {
    listen 80;
    listen [::]:80;
    server_name roomcad.91.99.176.243.nip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/minecraftai/web/site/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name roomcad.91.99.176.243.nip.io;

    ssl_certificate /etc/letsencrypt/live/roomcad.91.99.176.243.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roomcad.91.99.176.243.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Live-collaboration SSE stream: never buffer, keep the connection open.
    location /api/watch/ {
        proxy_pass http://127.0.0.1:8077;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://127.0.0.1:8077;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
