# RoomCAD is served end to end by Caddy on port 8443. nginx does not serve it,
# proxy it, or terminate TLS for it.
#
# This block exists for one reason: nginx owns ports 80 and 443 on this host and
# its default server answers for ANY hostname that matches nothing else. With no
# block for this name, RoomCAD's old address fell through to that default and
# served a completely different application — the Minecraft admin panel — to
# anyone with an old bookmark.
#
# So this sends people to the real address and nothing more. No proxy_pass, no
# root, no RoomCAD configuration of any kind lives here.
server {
    listen 80;
    listen [::]:80;
    server_name roomcad.91.99.176.243.nip.io;
    return 308 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name roomcad.91.99.176.243.nip.io;

    ssl_certificate     /etc/letsencrypt/live/roomcad.91.99.176.243.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roomcad.91.99.176.243.nip.io/privkey.pem;

    # 308 rather than 301: keeps the method and body, so a bookmarked deep link
    # or an API call is not silently turned into a GET.
    return 308 https://$host:8443$request_uri;
}
