name: tests

# The suite is this repository's only gate, and until now nothing ran it but a
# human. deploy.sh ships straight to production without touching it, so a
# broken commit could reach the live site with every test red.
#
# No install step: there is no package.json, no bundler and no dependencies —
# the app is plain ES modules and the API is Python's standard library.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The workflow reads the repository and nothing else, so the token gets nothing
# else. Without this the job inherits the repository's default token
# permissions, which on an older repository can be read/write for every scope.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Actions are pinned to a full commit SHA, with the human-readable version
      # in a comment. A tag is a movable pointer: whoever can write to the
      # action's repository can silently change what this repository's ONLY gate
      # does on the next push. Dependabot (or a manual bump) can update the SHA
      # and the comment together.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # node:sqlite (used by live-multi) needs Node >= 22.5.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      # The full suite, not --fast: city-fuzz alone runs for over six minutes,
      # and a fuzz file that never runs is a fuzz file that never finds anything.
      - name: Run the suite
        run: ./tests/run.sh

      - name: Report node and python versions
        if: always()
        run: |
          node --version
          python3 --version
